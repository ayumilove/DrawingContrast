[project]
name = "drawingcontrast"
version = "0.5.2"
description = "工程图纸差异对比工具：一键比对两版 PDF 图纸并以交互式网页呈现差异"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyqt6",
    "pyqt6-webengine",
    "opencv-python>=4.13,<5",
    "numpy",
    "pymupdf",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pyinstaller",
    "pillow",
]

[project.scripts]
drawing-contrast = "drawing_contrast.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drawing_contrast"]
